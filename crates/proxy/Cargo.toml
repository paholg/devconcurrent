[package]
name = "devconcurrent-proxy"
version.workspace = true
edition.workspace = true
description = "DNS resolver for devconcurrent devcontainers"
homepage.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
axum-reverse-proxy = { version = "2.4.0", default-features = false }
docker = { path = "../docker" }
eyre = "0.6.14"
fqdn = "0.5.2"
fqdn-trie = "0.5.0"
futures-util = "0.3.34"
hickory-proto = "0.26.3"
hickory-server = "0.26.3"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
indexmap.workspace = true
rcgen = { workspace = true }
rustls = "0.23.46"
serde_json.workspace = true
shared = { path = "../shared" }
time = "0.3"
tokio = { workspace = true, features = ["full"] }
tokio-rustls = "0.26.6"
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
